name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    # `@x207/core` is not published, so the job runs at the umbrella workspace with `npm ci` and the lockfile of the umbrella (see the
    # workflow file). A lone `npm install` of a temporary workspace had no lockfile and broke on 2026-11-02 when vitest 5.1.0 appeared.
    uses: x207-labs/x207/.github/workflows/ci-node-workspace.yml@ce9eb3772f676392c6c168c995afdfa3a53456d3 # OP-001
    with:
      path: agents
      package: "@x207/agents"
      build-first: "@x207/core @x207/scheme @x207/facilitator"
    secrets:
      checkout-token: ${{ secrets.X207_CHECKOUT_TOKEN }}
